<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve
         to real values in PWA standalone mode (notch / home indicator). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14161a" />
    <meta name="color-scheme" content="dark" />
    <!-- Applied before first paint, so a returning light-theme user never sees
         a flash of the dark theme while the stylesheet/bundle loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("badat:theme");
          var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e9f0e8");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="שיבוצניק" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>שיבוצניק</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
