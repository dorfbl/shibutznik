server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app shell (and sw.js, manifest, icons, sounds) is revalidated on
    # every load — otherwise browsers keep showing an old build after a
    # deploy, still pointing at the previous asset hashes. Unchanged files
    # come back as a cheap 304.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
